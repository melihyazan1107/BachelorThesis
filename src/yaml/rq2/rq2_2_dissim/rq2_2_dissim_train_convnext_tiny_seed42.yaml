experiment:
  rq: "RQ2.2-dissim"
  baseline_rq: "RQ1"
  model: "convnext_tiny"
  epochs: 100
  batch_size: 128
  early_stopping: false
  early_stopping_patience: 15
  seeds:
    - 42
  rates:
    - 0.0
    - 0.05
    - 0.1
    - 0.2
    - 0.5
    - 1.0

optimizer:
  type: "adamw"
  lr: 0.0004
  weight_decay: 0.001

scheduler:
  type: "cosine"
  warmup_epochs: 20
  warmup_start_factor: 0.01
  milestones: [50,75]
  gamma: 0.1

augmentations:
  random_crop: true
  random_horizontal_flip: true
  random_rotation: false
  color_jitter: false
  random_erasing: false

  crop_size: 224
  crop_scale: [0.8, 1.0]
  horizontal_flip_p: 0.5
  rotation_degrees: 15
  color_jitter_strength: 0.2
  erasing_p: 0.5
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

hardware:
  num_workers: 6
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  compile: true
  matmul_precision: "high"
  cudnn_benchmark: true
  in_memory_data: true
